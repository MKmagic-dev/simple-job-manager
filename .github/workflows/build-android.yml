name: Build Android APK

# Runs on GitHub's own clean Linux machines — sidesteps the local Windows
# Gradle/JDK bug that blocks building this app on this project's dev
# machine. Trigger manually from the Actions tab, or automatically on every
# push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      # .env is gitignored (it holds secrets), so it's recreated here from
      # GitHub repo secrets instead. Set these under
      # Settings -> Secrets and variables -> Actions in the GitHub repo.
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            # Surface the cause as a public annotation (job logs need a login).
            grep -n -i -E "error|exception|failed|what went wrong|caused by|requires|compile against|dependency" build.log | head -25 | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 15 build.log | cut -c1-300 | while IFS= read -r line; do echo "::warning::$line"; done
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
