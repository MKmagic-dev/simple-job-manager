name: Build Android APK

# Runs on GitHub's own clean Linux machines — sidesteps the local Windows
# Gradle/JDK bug that blocks building this app on this project's dev
# machine. Trigger manually from the Actions tab, or automatically on every
# push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      # .env is gitignored (it holds secrets), so it's recreated here from
      # GitHub repo secrets instead. Set these under
      # Settings -> Secrets and variables -> Actions in the GitHub repo.
      - name: Create .env file
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Prepare the upload keystore (if the secrets are set)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret set: builds use the debug key."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          echo "UPLOAD_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "UPLOAD_KEYSTORE_PASSWORD=$UPLOAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "UPLOAD_KEY_ALIAS=$UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "UPLOAD_KEY_PASSWORD=$UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            # Surface the cause as a public annotation (job logs need a login).
            grep -n -i -E "error|exception|failed|what went wrong|caused by|requires|compile against|dependency" build.log | head -25 | cut -c1-300 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 15 build.log | cut -c1-300 | while IFS= read -r line; do echo "::warning::$line"; done
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # The store (Google Play) takes the AAB bundle, not the APK.
      - name: Build release AAB (for Google Play)
        run: flutter build appbundle --release

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
